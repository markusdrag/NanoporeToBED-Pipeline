<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="125" viewBox="35 10 560 125">
  <rect x="35" y="10" width="560" height="125" fill="#ffffff"/>
  
  <!-- NANOPORE text -->
  <text x="50" y="100" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="52" font-weight="600" 
        fill="#1A2B4A" 
        text-anchor="start" dominant-baseline="middle">NANOPORE</text>
  
  <!-- Arrow -->
  <line x1="340" y1="100" x2="440" y2="100" 
        stroke="#E8734E" stroke-width="8" stroke-linecap="round"/>
  <polygon points="460,100 440,88 440,112" 
           fill="#E8734E"/>
  
  <!-- Flow dots -->
  <circle cx="370" cy="100" r="4" fill="#E8734E"/>
  <circle cx="400" cy="100" r="4" fill="#E8734E"/>
  <circle cx="430" cy="100" r="4" fill="#E8734E"/>
  
  <!-- BED text - closer to arrow -->
  <text x="480" y="100" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="52" font-weight="600" 
        fill="#1A2B4A" 
        text-anchor="start" dominant-baseline="middle">BED</text>
  
  <!-- Simplified 5mC above arrow -->
  <g transform="translate(400, 55)">
    <!-- Hexagon -->
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" 
             fill="rgba(26, 43, 74, 0.08)" stroke="#1A2B4A" stroke-width="2.5"/>
    
    <!-- CH3 methyl -->
    <line x1="0" y1="-12" x2="0" y2="-22" stroke="#E8734E" stroke-width="2.5"/>
    <circle cx="0" cy="-28" r="7" fill="#E8734E"/>
    <text x="0" y="-28" font-family="Inter, sans-serif" font-size="9" font-weight="bold" 
          fill="#ffffff" text-anchor="middle" dominant-baseline="middle">CH₃</text>
  </g>
  
  <!-- Label above -->
  <text x="400" y="25" 
        font-family="Inter, sans-serif" font-size="11" font-weight="400" 
        fill="#1A2B4A" opacity="0.6"
        text-anchor="middle" dominant-baseline="middle">5mC</text>
</svg>